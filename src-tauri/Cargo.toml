[package]
name = "iruka"
version = "0.1.0"
description = "Console & remote desktop fleet viewer"
authors = ["tosihide"]
edition = "2021"

[lib]
name = "iruka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
ironrdp-connector = { version = "0.10", optional = true }
ironrdp-session = { version = "0.11", optional = true }
ironrdp-pdu = { version = "0.9", optional = true }
ironrdp-input = { version = "0.7", optional = true }
ironrdp-graphics = { version = "0.9", optional = true }
ironrdp-blocking = { version = "0.10", optional = true }
ironrdp-core = { version = "0.2", optional = true }
x509-cert = { version = "0.2", optional = true }
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing = "0.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[features]
default = ["freerdp", "ironrdp"]
# FreeRDP 3（システムの libfreerdp3 / libwinpr3 を使う）。GNOME Remote Desktop に必要
freerdp = []
# IronRDP（Rust 製、追加の C ライブラリ不要）。Windows 向け
ironrdp = [
    "dep:ironrdp-connector",
    "dep:ironrdp-session",
    "dep:ironrdp-pdu",
    "dep:ironrdp-input",
    "dep:ironrdp-graphics",
    "dep:ironrdp-blocking",
    "dep:ironrdp-core",
    "dep:x509-cert",
    "dep:rustls",
]
